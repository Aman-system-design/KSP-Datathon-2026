<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign in | KSP Crime Decision Intelligence</title>
    <script src="https://static.zohocdn.com/catalyst/sdk/js/4.6.2/catalystWebSDK.js"></script>
    <script src="/__catalyst/sdk/init.js"></script>
    <style>
      :root { color: #17243a; font: 16px/1.5 Inter, "Noto Sans Kannada", "Segoe UI", Arial, sans-serif; background: #f4f7fb; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; }
      main { width: min(960px, calc(100% - 32px)); display: grid; grid-template-columns: 320px 1fr; background: #fff; border: 1px solid #d7e0ec; border-radius: 12px; box-shadow: 0 16px 48px rgba(22, 43, 77, .12); overflow: hidden; }
      header { padding: 48px 36px; color: #fff; background: #123b69; }
      header img { width: 88px; height: 88px; object-fit: contain; background: #fff; border-radius: 8px; }
      header h1 { margin: 24px 0 8px; font-size: 24px; line-height: 1.25; }
      header p { margin: 0; color: #dce9f7; }
      section { padding: 42px 48px; }
      section h2 { margin: 0 0 8px; font-size: 28px; }
      section > p { margin: 0 0 24px; color: #5a6980; }
      #loginDivElementId { min-height: 360px; }
      @media (max-width: 720px) { main { grid-template-columns: 1fr; } header, section { padding: 28px 24px; } header img { width: 64px; height: 64px; } }
    </style>
  </head>
  <body>
    <main>
      <header>
        <img src="/brand/ksp-logo.webp" alt="Karnataka State Police emblem" />
        <h1>KSP Crime Decision Intelligence</h1>
        <p>Governed analytics for authorized policing roles.</p>
      </header>
      <section>
        <h2>Secure sign in</h2>
        <p>Use your authorized Catalyst identity to continue.</p>
        <div id="loginDivElementId"></div>
      </section>
    </main>
    <script>
      catalyst.auth.signIn("loginDivElementId", { service_url: "/" });
    </script>
  </body>
</html>
