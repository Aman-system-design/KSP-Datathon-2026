<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
    <title>Sign in | KSP Crime Decision Intelligence</title>
    <script src="https://static.zohocdn.com/catalyst/sdk/js/4.6.2/catalystWebSDK.js"></script>
    <script src="/__catalyst/sdk/init.js"></script>
    <style>
      @font-face { font-family: Roboto; src: url("/fonts/roboto-latin-400-normal.woff2") format("woff2"); font-style: normal; font-weight: 400; font-display: swap; }
      @font-face { font-family: Roboto; src: url("/fonts/roboto-latin-500-normal.woff2") format("woff2"); font-style: normal; font-weight: 500; font-display: swap; }
      @font-face { font-family: Roboto; src: url("/fonts/roboto-latin-700-normal.woff2") format("woff2"); font-style: normal; font-weight: 700; font-display: swap; }
      :root { color: #172b3a; font: 16px/1.45 Roboto, "Noto Sans Kannada", "Segoe UI", Arial, sans-serif; background: #eef3f8; }
      * { box-sizing: border-box; }
      body { margin: 0; min-width: 320px; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 24px; }
      body::before { content: ""; position: fixed; inset: 0 0 auto; height: 4px; background: linear-gradient(90deg, #b4232c 0 50%, #e8a11a 50% 76%, #1d7655 76%); }
      main { width: min(960px, 100%); min-height: 560px; display: grid; grid-template-columns: 320px minmax(0, 1fr); background: #fff; border: 1px solid #d6dee7; border-radius: 12px; box-shadow: 0 16px 44px rgb(11 39 66 / 10%); overflow: hidden; }
      .identity { padding: 36px 32px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; background: #f7f9fc; border-right: 1px solid #e1e7ee; }
      .identity img { width: min(184px, 100%); aspect-ratio: 1; object-fit: contain; }
      .identity h1 { margin: 20px 0 7px; max-width: 250px; color: #0b2742; font-size: 23px; line-height: 1.24; font-weight: 700; letter-spacing: -.015em; }
      .identity p { margin: 0; max-width: 246px; color: #5e7080; font-size: 13px; }
      .authentication { min-width: 0; padding: 48px; display: grid; place-items: center; }
      .authentication__stack { width: min(380px, 100%); }
      #loginDivElementId { width: 100%; height: 300px; min-height: 0; overflow: hidden; }
      #loginDivElementId iframe { display: block !important; width: 100% !important; height: 300px !important; border: 0 !important; }
      .auth-error { margin: 12px 0 0; padding: 10px 12px; color: #8f1d24; background: #fff4f4; border: 1px solid #efc4c7; border-radius: 6px; font-size: 13px; }
      .auth-error[hidden] { display: none; }
      .security-note { margin: 18px 0 0; padding-top: 16px; color: #6a7b8b; border-top: 1px solid #e5eaf0; font-size: 11.5px; line-height: 1.5; text-align: center; }
      @media (max-width: 820px) {
        body { display: block; padding: 16px; }
        main { height: auto; min-height: 0; grid-template-columns: 1fr; }
        .identity { padding: 22px 24px; display: grid; grid-template-columns: 88px 1fr; column-gap: 18px; text-align: left; border-right: 0; border-bottom: 1px solid #e1e7ee; }
        .identity img { width: 88px; grid-row: 1 / 3; }
        .identity h1 { margin: 0 0 5px; font-size: 22px; }
        .identity p { font-size: 13px; }
        .authentication { padding: 32px 24px; }
      }
      @media (max-width: 480px) {
        body { padding: 8px; }
        main { border-radius: 8px; }
        .identity { padding: 18px; grid-template-columns: 68px 1fr; gap: 12px; }
        .identity img { width: 68px; }
        .identity h1 { font-size: 19px; }
        .authentication { padding: 24px 18px 18px; }
      }
    </style>
  </head>
  <body>
    <main>
      <header class="identity">
        <img src="/brand/karnataka-state-police.webp" alt="Karnataka State Police emblem" />
        <h1>KSP Crime Decision Intelligence</h1>
        <p>AI-driven crime analytics and operational intelligence.</p>
      </header>
      <section class="authentication">
        <div class="authentication__stack">
          <div id="loginDivElementId"></div>
          <p id="authError" class="auth-error" role="alert" hidden>Secure sign in could not be loaded. Refresh the page or contact your platform administrator.</p>
          <p class="security-note">Authentication and password security are managed by Catalyst by Zoho.</p>
        </div>
      </section>
    </main>
    <script>
      const host = document.getElementById("loginDivElementId");
      const normalizeCatalystFrame = () => {
        const frame = host.querySelector("iframe");
        if (!frame) return;
        frame.title = "Catalyst secure sign in";
        frame.scrolling = "no";
        frame.style.width = "100%";
        frame.style.height = "300px";
      };
      new MutationObserver(normalizeCatalystFrame).observe(host, { childList: true, subtree: true });
      try {
        catalyst.auth.signIn("loginDivElementId", {
          css_url: "/auth/catalyst-sign-in-v4.css",
          service_url: "/"
        });
        normalizeCatalystFrame();
      } catch {
        document.getElementById("authError").hidden = false;
      }
    </script>
  </body>
</html>
