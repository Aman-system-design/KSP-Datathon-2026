version: 2.1

jobs:
  verify:
    docker:
      - image: cimg/node:24.18.0
    steps:
      - checkout
      - restore_cache:
          keys:
            - npm-v2-node24-{{ checksum "package-lock.json" }}-{{ checksum "tools/node18-runtime/package-lock.json" }}
      - run: npm ci
      - run: npm ci --prefix tools/node18-runtime --ignore-scripts
      - save_cache:
          key: npm-v2-node24-{{ checksum "package-lock.json" }}-{{ checksum "tools/node18-runtime/package-lock.json" }}
          paths:
            - ~/.npm
      - run: npm run verify
      - run: npm run compat:node18
      - run: npm run geospatial:verify

workflows:
  pull-request-verification:
    jobs:
      - verify
